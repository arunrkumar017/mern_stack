<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astrology</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class = "container">
        <h1>Astrology Insights</h1>
        <form id = "astroForm">
            <lable for = "name">First Name:</lable>
            <input type = "text" id = "name" name = "name" required>

            <lable for = "surname">Surname:</lable>
            <input type = "text" id = "surname" name = "surname" required>

            <lable for = "day">Date of Birth (Day):</lable>
            <input type = "number" id = "day" name = "day" min="1" max="31" required>

            <lable for = "month">Month of Birth:</lable>
            <input type = "number" id = "month" name = "month" min="1" max="12" required>

            <lable for = "year">Year of Birth:</lable>
            <input type = "number" id = "year" name = "year" min="1900" max="2026" required>

            <input type = "submit" value = "Get Insights">
        </form>
        <div class = "result" id = "result"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
